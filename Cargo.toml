[package]
name = "pii-masker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jimmy Stridh <jimmy@stridh.dev>"]
description = "Rust port of the HydroXai PII masker with a library API and CLI."
license = "MIT"
repository = "https://github.com/jimmystridh/pii-masker"
homepage = "https://github.com/jimmystridh/pii-masker"
documentation = "https://docs.rs/pii-masker"
readme = "README.md"
keywords = ["pii", "redaction", "deberta", "nlp", "privacy"]
categories = ["text-processing", "command-line-utilities"]
exclude = [
  ".github/*",
  "model/*",
]

[dependencies]
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
clap = { version = "4.5.38", features = ["derive"] }
hf-hub = "0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokenizers = "0.22.2"
